<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#55777a">
  <meta name="description" content="跟著小小夢行者探索預算、儲蓄與分散風險。">
  <title>夢市預算站</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #dff0ec; }
    body { display: grid; place-items: center; padding: clamp(10px, 2vw, 28px); }
    #frame { position: relative; width: min(100%, 1440px); height: min(100%, 900px); overflow: hidden; border: 1px solid #9ab9af; border-radius: 22px; background: #c7e7ec; box-shadow: 0 24px 80px #31544b30; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #welcome { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg, #d7ece9ee, #f8eddaee); transition: opacity .35s ease; }
    #welcome.hidden { opacity: 0; pointer-events: none; }
    .card { width: min(100%, 520px); padding: clamp(24px, 5vw, 48px); border: 2px solid #b99a78; border-radius: 28px; background: #fff8e7; text-align: center; box-shadow: 0 18px 44px #4b5d5230; }
    .eyebrow { margin: 0 0 10px; color: #a76448; font-size: 14px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; color: #41434a; font-size: clamp(30px, 6vw, 48px); line-height: 1.15; }
    .subtitle { margin: 16px 0 24px; color: #65666a; font-size: 17px; line-height: 1.7; }
    button { min-height: 52px; padding: 0 26px; border: 2px solid #8a593e; border-radius: 14px; background: #c47755; color: white; font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; }
    button:hover { background: #ae6549; }
    button:focus-visible { outline: 4px solid #55777a; outline-offset: 3px; }
    #status { min-height: 24px; margin-top: 14px; color: #55777a; font-size: 14px; }
    #footer { position: absolute; right: 14px; bottom: 10px; z-index: 3; color: #415c5b; font-size: 12px; text-shadow: 0 1px #fff8e7; }
    @media (max-width: 640px) { body { padding: 0; } #frame { width: 100%; height: 100%; border: 0; border-radius: 0; } .card { border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <main id="frame" aria-label="夢市預算站遊戲">
    <canvas id="canvas" aria-label="夢市預算站互動遊戲"></canvas>
    <section id="welcome" aria-labelledby="game-title">
      <div class="card">
        <p class="eyebrow">紙雕童話 × 生活理財</p>
        <h1 id="game-title">夢市預算站</h1>
        <p class="subtitle">幫小小夢行者完成兩道理財挑戰，取得鑰匙，探索夢市與星種花園。</p>
        <button id="start" type="button">進入夢市</button>
        <div id="status" role="status" aria-live="polite">遊戲載入中，請稍候……</div>
      </div>
    </section>
    <div id="footer">建議使用鍵盤方向鍵或 A / D；解題按鈕支援觸控。</div>
  </main>
  <script src="index.js"></script>
  <script>
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","mainPack":"game-v4.pck","experimentalVK":true,"fileSizes":{"index.pck":345700,"index.wasm":39514754,"game-v4.pck":345700},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    const canvas = document.getElementById("canvas");
    const welcome = document.getElementById("welcome");
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    start.addEventListener("click", async () => {
      start.disabled = true;
      status.textContent = "正在開啟夢市……";
      try {
        await engine.startGame({
          canvas,
          onProgress: (current, total) => {
            if (total > 0 && current < total) status.textContent = `載入遊戲 ${Math.round(current / total * 100)}%……`;
          }
        });
        welcome.classList.add("hidden");
      } catch (error) {
        console.error(error);
        status.textContent = "載入失敗，請重新整理頁面，或改用最新版 Chrome、Edge、Safari 或 Firefox。";
        start.disabled = false;
      }
    });
  </script>
</body>
</html>
